<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<title>LanShare · 局域网共享</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
        <path d="M9.6 9.6a9 9 0 0 0 0 12.8M22.4 22.4a9 9 0 0 0 0-12.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".9"/>
        <path d="M6 6a14 14 0 0 0 0 20M26 26a14 14 0 0 0 0-20" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".38"/>
      </svg>
      <div>
        <div class="brand__name">LanShare</div>
        <div class="brand__host" id="deviceName">连接中…</div>
      </div>
    </div>

    <nav class="nav" aria-label="主导航">
      <button class="nav__item" data-route="files" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2a2 2 0 0 1 1.6.8l.9 1.2h7.3A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>
        <span>全部文件</span>
      </button>
      <button class="nav__item" data-route="shares">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 13.3l7.2 4.2M15.6 6.5L8.4 10.7"/></svg>
        <span>分享链接</span>
      </button>
    </nav>

    <div class="rail__spacer"></div>

    <div class="rail__foot">
      <div class="readout" id="readout">
        <div class="readout__bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="readout__meta">
          <b id="linkSpeed">空闲</b>
          <span id="clientCount">0 台设备在线</span>
        </div>
      </div>
      <button class="nav__item" id="themeToggle" style="padding-left:4px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">浅色模式</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar">
      <nav class="crumbs" id="crumbs" aria-label="路径"></nav>
      <div class="topbar__actions">
        <label class="search" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
          <input id="search" type="search" placeholder="搜索" autocomplete="off" spellcheck="false">
        </label>
        <div class="segmented desktop-only tablet-keep" role="group" aria-label="视图">
          <button id="viewList" aria-pressed="true" title="列表视图" aria-label="列表视图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button id="viewGrid" aria-pressed="false" title="网格视图" aria-label="网格视图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>
          </button>
        </div>
        <button class="btn btn--ghost btn--icon desktop-only tablet-keep" id="newFolderBtn" title="新建文件夹" aria-label="新建文件夹">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2a2 2 0 0 1 1.6.8l.9 1.2h7.3A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
        </button>
        <button class="btn btn--primary" id="uploadBtn" title="上传文件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
          <span class="btn__label">上传</span>
        </button>
      </div>
    </header>

    <div id="view"></div>
  </main>
</div>

<nav class="mobile-tabs" aria-label="移动导航" style="grid-template-columns:repeat(3,1fr)">
  <button data-route="files" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2a2 2 0 0 1 1.6.8l.9 1.2h7.3A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>
    <span>文件</span>
  </button>
  <button data-route="shares">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 13.3l7.2 4.2M15.6 6.5L8.4 10.7"/></svg>
    <span>分享</span>
  </button>
  <button id="mobileUpload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
    <span>上传</span>
  </button>
</nav>

<div class="bulkbar" id="bulkbar" role="region" aria-label="已选项目">
  <div class="bulkbar__count"><span id="selCount">0</span> 项</div>
  <div class="bulkbar__div"></div>
  <button class="btn btn--quiet btn--sm" id="bulkDownload" title="打包下载">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 18h14"/></svg><span>下载</span>
  </button>
  <button class="btn btn--quiet btn--sm" id="bulkShare" title="创建分享">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 13.3l7.2 4.2M15.6 6.5L8.4 10.7"/></svg><span>分享</span>
  </button>
  <button class="btn btn--quiet btn--sm" id="bulkDelete" title="删除">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5.2A1.2 1.2 0 0 1 10.2 4h3.6A1.2 1.2 0 0 1 15 5.2V7M6.5 7l.8 11.1A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.9L17.5 7"/></svg><span>删除</span>
  </button>
  <button class="btn btn--quiet btn--sm" id="bulkClear" title="取消选择">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>取消</span>
  </button>
</div>

<div class="transfers" id="transfers">
  <div class="transfers__head">
    <span class="transfers__title" id="transfersTitle">传输队列</span>
    <button class="btn btn--quiet btn--sm" id="transfersToggle">收起</button>
    <button class="btn btn--quiet btn--icon btn--sm" id="transfersClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="transfers__list" id="transfersList"></div>
</div>

<div class="drag-veil" aria-hidden="true">
  <div class="drag-veil__card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
    松手上传到当前目录
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__head">
      <div class="modal__title" id="modalTitle">标题</div>
      <button class="btn btn--quiet btn--icon" id="modalClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal__body" id="modalBody"></div>
    <div class="modal__foot" id="modalFoot"></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<input type="file" id="fileInput" multiple hidden>
<input type="file" id="folderInput" webkitdirectory directory multiple hidden>

<script type="module" src="/js/app.js"></script>
</body>
</html>
